[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-hub"
version = "0.3.0"
description = "Local-first reviewed knowledge and readable topics"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.136",
    "starlette==1.3.1",
    "anyio==4.14.2",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "mcp>=1.12,<2",
    "jsonschema>=4.20,<5",
    "platformdirs>=4,<5",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "pillow>=12,<14",
]

[project.optional-dependencies]
desktop = ["pywebview>=6; sys_platform == 'darwin'", "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'", "pyobjc-framework-WebKit>=11; sys_platform == 'darwin'", "pyobjc-framework-Security>=11; sys_platform == 'darwin'"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2", "pyinstaller>=6,<7"]

[project.scripts]
knowledge-hub = "knowledge_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
