name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Prepare isolated scratch
        run: |
          # RUNNER_TEMP is a runner-provided environment value, not PR content.
          mkdir -p "$RUNNER_TEMP/knowledge-hub-scratch" "$RUNNER_TEMP/knowledge-hub-synthetic"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/knowledge-hub-scratch" >> "$GITHUB_ENV"
          printf 'KNOWLEDGE_HUB_DATA_DIR=%s\n' "$RUNNER_TEMP/knowledge-hub-synthetic" >> "$GITHUB_ENV"
      - name: Install locked desktop and test dependencies
        run: uv sync --locked --extra desktop --group dev
      - name: Install browser used by the test fixture
        run: uv run --locked --extra desktop --group dev playwright install chrome
      - name: Check lock consistency
        run: uv lock --check
      - name: Check frontend syntax
        run: node --check src/knowledge_hub/web/app.js
      - name: Run source contracts, browser and native boundary tests
        run: uv run --locked --extra desktop --group dev pytest -q -rs --basetemp "$TMPDIR/pytest"
      # No provider credentials, signing opt-in, private data or uploaded artifacts.
      # Installed-CLI and Keychain integration tests report explicit skip reasons.
